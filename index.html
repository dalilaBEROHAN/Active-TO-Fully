<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ActiveTOFully OBGYN HSIJB</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore-compat.js"></script>

    <style>
        @keyframes custom-blink {
            0%, 100% { opacity: 1; transform: scale(1); background-color: #ef4444; color: white;}
            50% { opacity: 0.8; transform: scale(1.02); background-color: #fee2e2; color: #b91c1c;}
        }
        .animate-blink { animation: custom-blink 1s infinite; }
        
        @keyframes warning-blink {
            0%, 100% { background-color: #fef08a; color: #000; }
            50% { background-color: #ca8a04; color: #fff; }
        }
        .animate-warning-blink { animation: warning-blink 1.5s infinite; }

        .tag-red { background-color: #fee2e2; }
        .tag-yellow { background-color: #fef08a; }
        .tag-green { background-color: #dcfce3; }
        .tag-white { background-color: #ffffff; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        // --- 1. FIREBASE INITIALIZATION ---
        const firebaseConfig = {
            apiKey: "AIzaSyDfEkexQwYJvNHh8M-aDEL3IjIL0toymTE",
            authDomain: "atof-e7735.firebaseapp.com",
            projectId: "atof-e7735",
            storageBucket: "atof-e7735.firebasestorage.app",
            messagingSenderId: "171236957444",
            appId: "1:171236957444:web:3d6902af5bbe3531fd8451"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Constants & Utilities
        const BED_CAPACITY = 6;
        const tagPriority = { "Red": 1, "Yellow": 2, "Green": 3, "White": 4 };
        
        const getValidDate = (ts) => {
            if (!ts) return new Date();
            return ts.toDate ? ts.toDate() : new Date(ts);
        };

        const formatDuration = (ms) => {
            if (!ms || ms < 0) return "0h 0m";
            const h = Math.floor(ms / 3600000);
            const m = Math.floor((ms % 3600000) / 60000);
            return `${h}h ${m}m`;
        };

        const formatTimeOnly = (dateStr) => {
            if(!dateStr) return "-";
            const d = new Date(dateStr);
            return d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        };

        const App = () => {
            const [started, setStarted] = React.useState(false);
            const [now, setNow] = React.useState(new Date());
            const [patients, setPatients] = React.useState([]);
            const [archives, setArchives] = React.useState([]);
            
            const [doctorsOnDuty, setDoctorsOnDuty] = React.useState(2);
            const [nursesOnDuty, setNursesOnDuty] = React.useState(4);
            const [activeTab, setActiveTab] = React.useState('waitlist');

            const [formData, setFormData] = React.useState({
                name: '', mrn: '', ward: 'PAC', tag: 'Green', 
                obCmiScore: 0, highRiskInfo: []
            });

            React.useEffect(() => {
                const interval = setInterval(() => setNow(new Date()), 60000);
                return () => clearInterval(interval);
            }, []);

            React.useEffect(() => {
                if(!started) return;

                const unsubActive = db.collection('patients').onSnapshot(snapshot => {
                    const activeList = [];
                    snapshot.forEach(doc => {
                        activeList.push({ id: doc.id, ...doc.data() });
                    });
                    
                    activeList.sort((a, b) => {
                        if (tagPriority[a.tag] !== tagPriority[b.tag]) return tagPriority[a.tag] - tagPriority[b.tag];
                        if (b.obCmiScore !== a.obCmiScore) return b.obCmiScore - a.obCmiScore;
                        return getValidDate(a.createdAt) - getValidDate(b.createdAt);
                    });
                    
                    setPatients(activeList);
                });

                const unsubArchive = db.collection('archives').orderBy('dischargedAt', 'desc').onSnapshot(snapshot => {
                    const archList = [];
                    snapshot.forEach(doc => archList.push({ id: doc.id, ...doc.data() }));
                    setArchives(archList);
                });

                return () => {
                    unsubActive();
                    unsubArchive();
                }
            }, [started]);

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const toggleHighRisk = (item) => {
                setFormData(prev => {
                    const exists = prev.highRiskInfo.includes(item);
                    return {
                        ...prev,
                        highRiskInfo: exists ? prev.highRiskInfo.filter(i => i !== item) : [...prev.highRiskInfo, item]
                    };
                });
            };

            const addPatient = async () => {
                if (!formData.name || !formData.mrn) return alert("Please enter Name and MRN");
                await db.collection('patients').add({
                    ...formData,
                    status: 'waiting',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                setFormData({ name: '', mrn: '', ward: 'PAC', tag: 'Green', obCmiScore: 0, highRiskInfo: [] });
            };

            const sendToLR = async (id) => {
                const lrCount = patients.filter(p => p.status === 'pending_lr' || p.status === 'in_lr').length;
                if (lrCount >= BED_CAPACITY) return alert("Labor Room is at full capacity (6 beds)!");
                await db.collection('patients').doc(id).update({
                    status: 'pending_lr',
                    sentToLrAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            };

            const acceptInLR = async (id) => {
                await db.collection('patients').doc(id).update({
                    status: 'in_lr',
                    acceptedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            };

            const dischargePatient = async (patient) => {
                const dischargeTime = firebase.firestore.FieldValue.serverTimestamp();
                await db.collection('archives').add({
                    ...patient,
                    dischargedAt: dischargeTime
                });
                await db.collection('patients').doc(patient.id).delete();
            };

            if (!started) {
                return (
                    <div className="flex items-center justify-center min-h-screen bg-gradient-to-br from-fuchsia-600 to-purple-800">
                        <div className="bg-white p-10 rounded-2xl shadow-2xl text-center max-w-md w-full">
                            <h1 className="text-3xl font-bold text-gray-800 mb-6">ActiveTOFully OBGYN HSIJB</h1>
                            <p className="text-gray-600 mb-8">Click below to start shift and enable system alerts & database sync.</p>
                            <button onClick={() => setStarted(true)} className="w-full bg-fuchsia-600 hover:bg-fuchsia-700 text-white font-bold py-4 px-6 rounded-xl text-lg shadow-lg transform transition active:scale-95">
                                Start Shift
                            </button>
                        </div>
                    </div>
                );
            }

            const waitlist = patients.filter(p => p.status === 'waiting');
            const lrPatients = patients.filter(p => p.status === 'pending_lr' || p.status === 'in_lr');
            const overdueCount = waitlist.filter(p => (now - getValidDate(p.createdAt)) > 14400000).length;

            return (
                <div className="max-w-7xl mx-auto p-4 md:p-6 font-sans">
                    <div className="bg-gradient-to-r from-violet-700 via-fuchsia-600 to-rose-500 rounded-2xl p-6 mb-6 text-white shadow-xl flex flex-col md:flex-row justify-between items-center gap-4">
                        <div>
                            <h1 className="text-3xl font-extrabold tracking-tight">ActiveTOFully OBGYN</h1>
                            <p className="text-fuchsia-100 font-medium">Hospital Sultan Ismail Johor Bahru</p>
                        </div>
                        <div className="text-right">
                            <p className="text-2xl font-bold">{now.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</p>
                            <p className="text-sm font-medium text-fuchsia-100">{now.toLocaleDateString('en-MY', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p>
                        </div>
                    </div>

                    <div className="grid grid-cols-2 md:grid-cols-5 gap-4 mb-8">
                        <div className="bg-white p-4 rounded-xl shadow border border-gray-100 flex flex-col items-center">
                            <span className="text-gray-500 text-sm font-bold">Waitlist</span>
                            <span className="text-4xl font-extrabold text-violet-700">{waitlist.length}</span>
                        </div>
                        <div className="bg-white p-4 rounded-xl shadow border border-gray-100 flex flex-col items-center">
                            <span className="text-gray-500 text-sm font-bold">LR Beds Occupied</span>
                            <span className="text-4xl font-extrabold text-blue-600">{lrPatients.length}/{BED_CAPACITY}</span>
                        </div>
                        <div className={`p-4 rounded-xl shadow border flex flex-col items-center ${overdueCount > 0 ? 'animate-blink' : 'bg-white border-gray-100'}`}>
                            <span className={`text-sm font-bold ${overdueCount > 0 ? 'text-white' : 'text-gray-500'}`}>Overdue &gt;4 Hrs</span>
                            <span className={`text-4xl font-extrabold ${overdueCount > 0 ? 'text-white' : 'text-red-600'}`}>{overdueCount}</span>
                        </div>
                        <div className="bg-white p-4 rounded-xl shadow border border-gray-100 flex flex-col items-center justify-between">
                            <span className="text-gray-500 text-sm font-bold">Doctors</span>
                            <div className="flex items-center gap-3">
                                <button onClick={() => setDoctorsOnDuty(d=>Math.max(0,d-1))} className="w-8 h-8 rounded-full bg-gray-100 font-bold">-</button>
                                <span className="text-2xl font-extrabold">{doctorsOnDuty}</span>
                                <button onClick={() => setDoctorsOnDuty(d=>d+1)} className="w-8 h-8 rounded-full bg-gray-100 font-bold">+</button>
                            </div>
                        </div>
                        <div className="bg-white p-4 rounded-xl shadow border border-gray-100 flex flex-col items-center justify-between">
                            <span className="text-gray-500 text-sm font-bold">Nurses</span>
                            <div className="flex items-center gap-3">
                                <button onClick={() => setNursesOnDuty(d=>Math.max(0,d-1))} className="w-8 h-8 rounded-full bg-gray-100 font-bold">-</button>
                                <span className="text-2xl font-extrabold">{nursesOnDuty}</span>
                                <button onClick={() => setNursesOnDuty(d=>d+1)} className="w-8 h-8 rounded-full bg-gray-100 font-bold">+</button>
                            </div>
                        </div>
                    </div>

                    <div className="flex gap-2 mb-6 border-b pb-2 overflow-x-auto">
                        <button onClick={()=>setActiveTab('waitlist')} className={`px-6 py-2 rounded-full font-bold whitespace-nowrap ${activeTab === 'waitlist' ? 'bg-violet-600 text-white shadow-md' : 'bg-gray-200 text-gray-600 hover:bg-gray-300'}`}>Waitlist & Registration</button>
                        <button onClick={()=>setActiveTab('lr')} className={`px-6 py-2 rounded-full font-bold whitespace-nowrap ${activeTab === 'lr' ? 'bg-blue-600 text-white shadow-md' : 'bg-gray-200 text-gray-600 hover:bg-gray-300'}`}>Labor Room ({lrPatients.length})</button>
                        <button onClick={()=>setActiveTab('history')} className={`px-6 py-2 rounded-full font-bold whitespace-nowrap ${activeTab === 'history' ? 'bg-teal-600 text-white shadow-md' : 'bg-gray-200 text-gray-600 hover:bg-gray-300'}`}>Study / History Data</button>
                    </div>

                    {activeTab === 'waitlist' && (
                        <div className="grid md:grid-cols-3 gap-6">
                            <div className="md:col-span-1 bg-white p-5 rounded-xl shadow border border-gray-200 h-fit">
                                <h3 className="text-lg font-bold mb-4 border-b pb-2">Register Patient</h3>
                                
                                <div className="space-y-3">
                                    <input type="text" name="name" value={formData.name} onChange={handleInputChange} placeholder="Patient Name" className="w-full p-2 border rounded font-medium focus:outline-fuchsia-500" />
                                    <input type="text" name="mrn" value={formData.mrn} onChange={handleInputChange} placeholder="MRN / IC No." className="w-full p-2 border rounded font-medium focus:outline-fuchsia-500" />
                                    
                                    <div className="flex gap-2">
                                        <select name="ward" value={formData.ward} onChange={handleInputChange} className="flex-1 p-2 border rounded font-bold bg-gray-50">
                                            <option value="PAC">PAC</option>
                                            <option value="Ward 4A">Ward 4A</option>
                                            <option value="Ward 4B">Ward 4B</option>
                                        </select>
                                        <select name="tag" value={formData.tag} onChange={handleInputChange} className="flex-1 p-2 border rounded font-bold bg-gray-50">
                                            <option value="Red" className="text-red-600">Red Tag</option>
                                            <option value="Yellow" className="text-yellow-600">Yellow Tag</option>
                                            <option value="Green" className="text-green-600">Green Tag</option>
                                            <option value="White">White Tag</option>
                                        </select>
                                    </div>

                                    <div className="pt-2">
                                        <label className="text-xs font-bold text-red-600 mb-1 block">HIGH RISK CRITERIA</label>
                                        <div className="grid grid-cols-2 gap-1 text-xs">
                                            {["1 Previous CS", "H/O Myomectomy", "Grandmultipara", "H/O PPH", "Previous Laparotomy", "Shoulder Dystocia", "Baby > 3.9kg", "H/O pre/eclampsia"].map(item => (
                                                <label key={item} className="flex items-center gap-1 p-1 bg-gray-50 rounded border cursor-pointer hover:bg-gray-100">
                                                    <input type="checkbox" checked={formData.highRiskInfo.includes(item)} onChange={() => toggleHighRisk(item)} className="accent-red-600" /> {item}
                                                </label>
                                            ))}
                                        </div>
                                    </div>

                                    <button onClick={addPatient} className="w-full mt-4 bg-fuchsia-600 hover:bg-fuchsia-700 text-white font-bold py-3 px-4 rounded shadow">Add to Waitlist</button>
                                </div>
                            </div>

                            <div className="md:col-span-2 overflow-x-auto bg-white rounded-xl shadow border border-gray-200">
                                <table className="w-full text-left border-collapse min-w-[700px]">
                                    <thead>
                                        <tr className="bg-gray-100 text-gray-700 text-sm">
                                            <th className="p-3">Antenatal Tag</th>
                                            <th className="p-3">Patient Details</th>
                                            <th className="p-3">Location</th>
                                            <th className="p-3">Wait Duration</th>
                                            <th className="p-3">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-100">
                                        {waitlist.length === 0 ? <tr><td colSpan="5" className="p-6 text-center text-gray-400 font-bold">No patients in waitlist.</td></tr> : null}
                                        {waitlist.map(p => {
                                            const waitMs = now - getValidDate(p.createdAt);
                                            const isOverdue = waitMs > 14400000;
                                            
                                            return (
                                                <tr key={p.id} className={`tag-${p.tag.toLowerCase()} bg-opacity-30 transition-colors`}>
                                                    <td className="p-3">
                                                        <span className={`px-3 py-1 rounded-full text-xs font-extrabold uppercase border border-current ${p.tag === 'Red' ? 'text-red-700 bg-red-100' : p.tag === 'Yellow' ? 'text-yellow-700 bg-yellow-100' : p.tag === 'Green' ? 'text-green-700 bg-green-100' : 'text-gray-700 bg-white'}`}>
                                                            {p.tag}
                                                        </span>
                                                    </td>
                                                    <td className="p-3">
                                                        <div className="font-bold text-gray-900 text-lg">{p.name}</div>
                                                        <div className="text-xs text-gray-500 font-mono mb-1">MRN: {p.mrn}</div>
                                                        {p.highRiskInfo.length > 0 && (
                                                            <div className="text-xs font-bold px-2 py-1 rounded animate-warning-blink border border-black inline-block mt-1">
                                                                ⚠️ HIGH RISK: {p.highRiskInfo.join(', ')}
                                                            </div>
                                                        )}
                                                    </td>
                                                    <td className="p-3 font-bold text-gray-700">{p.ward}</td>
                                                    <td className="p-3">
                                                        {isOverdue ? (
                                                            <div className="text-white font-bold px-3 py-1 rounded animate-blink text-center text-sm shadow">
                                                                &gt;4 Hrs Overdue<br/><span className="text-xs">{formatDuration(waitMs)}</span>
                                                            </div>
                                                        ) : (
                                                            <div className="text-gray-800 font-bold">{formatDuration(waitMs)}</div>
                                                        )}
                                                    </td>
                                                    <td className="p-3">
                                                        <button onClick={() => sendToLR(p.id)} className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-4 rounded text-sm shadow w-full whitespace-nowrap">
                                                            SEND TO LR
                                                        </button>
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {activeTab === 'lr' && (
                        <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
                            {lrPatients.length === 0 ? <div className="col-span-full text-center p-10 text-gray-400 font-bold bg-white rounded-xl shadow border">Labor Room is currently empty.</div> : null}
                            {lrPatients.map((p, index) => {
                                const isPending = p.status === 'pending_lr';
                                const duration = isPending ? (now - getValidDate(p.sentToLrAt)) : (now - getValidDate(p.acceptedAt));

                                return (
                                    <div key={p.id} className={`p-5 rounded-xl shadow-lg border-2 ${isPending ? 'border-orange-400 bg-orange-50' : 'border-blue-400 bg-blue-50'}`}>
                                        <div className="flex justify-between items-start mb-2">
                                            <span className="px-2 py-1 bg-white rounded text-xs font-bold shadow text-gray-700">Bed {index + 1}</span>
                                            {isPending ? (
                                                <span className="px-2 py-1 bg-orange-200 text-orange-800 rounded text-xs font-bold animate-pulse border border-orange-400">Arriving / Pending</span>
                                            ) : (
                                                <span className="px-2 py-1 bg-blue-200 text-blue-800 rounded text-xs font-bold border border-blue-400">Admitted</span>
                                            )}
                                        </div>
                                        <h3 className="font-bold text-xl text-gray-900">{p.name}</h3>
                                        <p className="text-sm text-gray-500 font-mono mb-4">MRN: {p.mrn} | From: {p.ward}</p>
                                        
                                        <div className="bg-white p-3 rounded mt-2 border flex justify-between items-center mb-4">
                                            <span className="text-xs font-bold text-gray-500">{isPending ? 'Transfer Time' : 'Time in LR'}</span>
                                            <span className="font-mono font-bold text-lg">{formatDuration(duration)}</span>
                                        </div>

                                        {isPending ? (
                                            <button onClick={() => acceptInLR(p.id)} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded shadow mt-auto">ACCEPT PATIENT</button>
                                        ) : (
                                            <button onClick={() => dischargePatient(p)} className="w-full bg-gray-800 hover:bg-gray-900 text-white font-bold py-3 px-4 rounded shadow mt-auto">Discharge / Postnatal</button>
                                        )}
                                    </div>
                                );
                            })}
                        </div>
                    )}

                    {activeTab === 'history' && (
                        <div className="bg-white rounded-xl shadow border border-gray-200 overflow-hidden">
                            <div className="p-4 bg-teal-600 text-white">
                                <h2 className="font-bold text-lg">Patient Flow Data (For Clinical Audit)</h2>
                                <p className="text-xs text-teal-100">Durations are calculated automatically based on real-time timestamps.</p>
                            </div>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left border-collapse text-sm min-w-[900px]">
                                    <thead>
                                        <tr className="bg-gray-100 text-gray-700">
                                            <th className="p-3 border-b">Name / MRN</th>
                                            <th className="p-3 border-b">Tag & Ward</th>
                                            <th className="p-3 border-b">Registered At</th>
                                            <th className="p-3 border-b">Accepted LR At</th>
                                            <th className="p-3 border-b">Discharged At</th>
                                            <th className="p-3 border-b bg-yellow-50 text-center">Waitlist Duration</th>
                                            <th className="p-3 border-b bg-blue-50 text-center">Labour Room Duration</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-200">
                                        {archives.length === 0 ? <tr><td colSpan="7" className="p-6 text-center text-gray-400 font-bold">No historical data found yet.</td></tr> : null}
                                        {archives.map(p => {
                                            const created = getValidDate(p.createdAt);
                                            const accepted = getValidDate(p.acceptedAt);
                                            const discharged = getValidDate(p.dischargedAt);
                                            
                                            const waitDurationMs = accepted && created ? (accepted - created) : 0;
                                            const lrDurationMs = discharged && accepted ? (discharged - accepted) : 0;

                                            return (
                                                <tr key={p.id} className="hover:bg-gray-50">
                                                    <td className="p-3 font-medium text-gray-900">{p.name}<br/><span className="text-xs text-gray-500">{p.mrn}</span></td>
                                                    <td className="p-3"><span className={`px-2 py-0.5 rounded text-xs font-bold bg-gray-200`}>{p.tag}</span><br/><span className="text-xs">{p.ward}</span></td>
                                                    <td className="p-3 text-gray-600">{created.toLocaleDateString()}<br/><b>{formatTimeOnly(created)}</b></td>
                                                    <td className="p-3 text-gray-600">{accepted ? <>{accepted.toLocaleDateString()}<br/><b>{formatTimeOnly(accepted)}</b></> : '-'}</td>
                                                    <td className="p-3 text-gray-600">{discharged ? <>{discharged.toLocaleDateString()}<br/><b>{formatTimeOnly(discharged)}</b></> : '-'}</td>
                                                    <td className="p-3 bg-yellow-50 font-mono text-center font-bold text-yellow-800">{formatDuration(waitDurationMs)}</td>
                                                    <td className="p-3 bg-blue-50 font-mono text-center font-bold text-blue-800">{formatDuration(lrDurationMs)}</td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
