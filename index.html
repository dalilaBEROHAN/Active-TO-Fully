<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ActiveTOFully OBGYN HSIJB</title>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel (To compile JSX in the browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome for Icons (Replacing Lucide for single-file simplicity) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Custom Animations */
        @keyframes urgentBlink {
          0%, 100% { background-color: #ef4444; color: white; box-shadow: 0 0 15px rgba(239, 68, 68, 0.8); border-color: #b91c1c; transform: scale(1); }
          50% { background-color: #dc2626; color: #fecaca; box-shadow: 0 0 25px rgba(220, 38, 38, 1); border-color: #991b1b; transform: scale(1.05); }
        }
        .animate-urgent-blink {
          animation: urgentBlink 0.3s ease-in-out infinite;
        }
        @keyframes warningBlink {
          0%, 100% { background-color: #facc15; color: black; box-shadow: 0 0 15px rgba(250, 204, 21, 0.8); border-color: #ca8a04; transform: scale(1); }
          50% { background-color: #fef08a; color: black; box-shadow: 0 0 25px rgba(250, 204, 21, 1); border-color: #eab308; transform: scale(1.02); }
        }
        .animate-warning-blink {
          animation: warningBlink 0.5s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-slate-50 font-sans">
    
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const MAX_BEDS = 6;
        const FOUR_HOURS_MS = 4 * 60 * 60 * 1000; 
        const ONE_HOUR_MS = 60 * 60 * 1000;

        const TAG_PRIORITY = {
          'Red': 1,
          'Yellow': 2,
          'Green': 3,
          'White': 4
        };

        const COMORBIDITIES = [
          { id: 'pe_severe', label: 'Pre-eclampsia with severe features or eclampsia', points: 5 },
          { id: 'chf', label: 'Congestive heart failure', points: 5 },
          { id: 'p_htn', label: 'Pulmonary hypertension', points: 4 },
          { id: 'cong_heart', label: 'Congenital heart and/or Valvular disease', points: 4 },
          { id: 'placenta', label: 'Placenta previa/Suspected accreta/Abruption', points: 4 },
          { id: 'ihd_arrhythmia', label: 'Ischemic heart disease/Cardiac arrhythmia', points: 3 },
          { id: 'sickle_coag', label: 'Sickle cell/Bleeding disorder/Coagulopathy', points: 3 },
          { id: 'age_gt_44', label: 'Maternal age >44', points: 3 },
          { id: 'bmi_gt_50', label: 'BMI >50', points: 3 },
          { id: 'pe_htn', label: 'Pre-eclampsia/Gestational HTN/Chronic HTN', points: 2 },
          { id: 'mult_gest', label: 'Multiple gestation', points: 2 },
          { id: 'iufd', label: 'Intrauterine fetal demise', points: 2 },
          { id: 'autoimmune', label: 'Autoimmune disease/Lupus', points: 2 },
          { id: 'hiv', label: 'HIV/AIDS', points: 2 },
          { id: 'neuro', label: 'Epilepsy/CVA/Neuromuscular disorder', points: 2 },
          { id: 'age_40_44', label: 'Maternal age 40–44', points: 2 },
          { id: 'substance', label: 'Substance use disorder', points: 2 },
          { id: 'bmi_gt_40', label: 'BMI >40', points: 2 },
          { id: 'prev_cs', label: 'Previous cesarean delivery/Myomectomy', points: 1 },
          { id: 'ckd', label: 'Chronic renal disease', points: 1 },
          { id: 'asthma', label: 'Asthma', points: 1 },
          { id: 'dm_insulin', label: 'Diabetes on insulin', points: 1 },
          { id: 'alcohol', label: 'Alcohol abuse', points: 1 }
        ];

        const HIGH_RISK_CRITERIA = [
          { id: 'prev_cs', label: '1 Previous CS' },
          { id: 'myomectomy', label: 'H/O Myomectomy' },
          { id: 'grandmultipara', label: 'Grandmultipara' },
          { id: 'hx_pph', label: 'History of PPH' },
          { id: 'prev_lap', label: 'H/O previous laparotomy' },
          { id: 'shoulder_dystocia', label: 'H/O shoulder dystocia' },
          { id: 'macrosomia', label: 'H/O previous baby > 3.9kg' },
          { id: 'hx_pe', label: 'H/O pre/eclampsia' }
        ];

        const LOCATIONS = ['Ward 4A', 'Ward 4B', 'Patient Assessment Centre (PAC)'];

        const ANTENATAL_TAGS = {
          'Red': { bg: 'bg-red-50', badge: 'bg-red-500 text-white', label: 'Red (Emergency)' },
          'Yellow': { bg: 'bg-yellow-50', badge: 'bg-yellow-400 text-yellow-950', label: 'Yellow (Urgent)' },
          'Green': { bg: 'bg-emerald-50', badge: 'bg-emerald-500 text-white', label: 'Green (Moderate)' },
          'White': { bg: 'bg-white', badge: 'bg-slate-200 text-slate-800', label: 'White (Low Risk)' }
        };

        const formatWaitTime = (startTime, currentTime) => {
          const diffMs = currentTime - startTime;
          const hours = Math.floor(diffMs / (1000 * 60 * 60));
          const minutes = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
          return `${hours}h ${minutes}m`;
        };

        // Audio System
        let audioCtx = null;
        const initAudio = () => {
          if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          }
          if (audioCtx.state === 'suspended') {
            audioCtx.resume();
          }
        };

        const playTone = (frequency, type, duration) => {
          if (!audioCtx) return;
          try {
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.type = type;
            oscillator.frequency.value = frequency;
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime); 
            gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            setTimeout(() => oscillator.stop(), duration * 1000);
          } catch (e) {}
        };

        const playSuccessSound = () => {
          playTone(523.25, 'sine', 0.1); // C5
          setTimeout(() => playTone(659.25, 'sine', 0.2), 100); // E5
        };

        const playNoticeSound = () => {
          playTone(440, 'sine', 0.2); // A4
          setTimeout(() => playTone(440, 'sine', 0.3), 200); 
        };

        const playAlarmSound = () => {
          if (!audioCtx) return;
          let count = 0;
          const interval = setInterval(() => {
            try {
              const osc = audioCtx.createOscillator();
              const gain = audioCtx.createGain();
              osc.connect(gain);
              gain.connect(audioCtx.destination);
              osc.type = 'square';
              osc.frequency.setValueAtTime(count % 2 === 0 ? 800 : 600, audioCtx.currentTime);
              osc.start();
              gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.25);
              osc.stop(audioCtx.currentTime + 0.25);
              count++;
              if (count >= 20) clearInterval(interval); 
            } catch(e) { clearInterval(interval); }
          }, 250);
        };

        // Main App Component
        function App() {
          const [sessionStarted, setSessionStarted] = useState(false);
          const [activeTab, setActiveTab] = useState('waitlist'); 
          const [showAddForm, setShowAddForm] = useState(false);
          const [currentTime, setCurrentTime] = useState(Date.now());
          const [doctorsCount, setDoctorsCount] = useState(3);
          const [nursesCount, setNursesCount] = useState(8);
          
          const [alerts, setAlerts] = useState([]);
          const notifiedOverdueRef = useRef(new Set());
          const [lrCallNotified, setLrCallNotified] = useState(false);
          const [emptyBedTimers, setEmptyBedTimers] = useState([]);

          // Waitlist
          const [waitlist, setWaitlist] = useState([
            {
              id: 'w1', name: 'Nadia Hassan', rn: 'RN-10027', location: 'Patient Assessment Centre (PAC)',
              gravida: '5', para: '4', dilation: '9', antenatalTag: 'Red', notes: 'Fully dilated in PAC, immediate transfer required!',
              comorbidities: ['mult_gest'], highRiskCriteria: ['grandmultipara'], cmiScore: 2, addedAt: Date.now() - (5 * 60000)
            },
            {
              id: 'w2', name: 'Amina binti Yusuf', rn: 'RN-10021', location: 'Patient Assessment Centre (PAC)',
              gravida: '1', para: '0', dilation: '8', antenatalTag: 'Yellow', notes: 'Fetal bradycardia, prep for EmLSCS if no progress.',
              comorbidities: ['pe_severe'], highRiskCriteria: [], cmiScore: 5, addedAt: Date.now() - (25 * 60000) 
            },
            {
              id: 'w3', name: 'Siti Nurhaliza', rn: 'RN-10022', location: 'Ward 4A',
              gravida: '3', para: '2', dilation: '6', antenatalTag: 'Red', notes: 'Severe pain, requesting epidural. BP 150/100.',
              comorbidities: ['prev_cs', 'bmi_gt_40', 'pe_htn'], highRiskCriteria: ['prev_cs', 'hx_pph', 'hx_pe'], cmiScore: 5, addedAt: Date.now() - (150 * 60000) 
            },
            {
              id: 'w4', name: 'Emily Chen', rn: 'RN-10026', location: 'Ward 4B',
              gravida: '2', para: '1', dilation: '7', antenatalTag: 'Green', notes: 'Active phase, progressing steadily.',
              comorbidities: ['asthma'], highRiskCriteria: [], cmiScore: 1, addedAt: Date.now() - (60 * 60000) 
            },
            {
              id: 'w5', name: 'Mei Ling', rn: 'RN-10023', location: 'Patient Assessment Centre (PAC)',
              gravida: '2', para: '1', dilation: '4', antenatalTag: 'Yellow', notes: 'Coping well, contractions 3 in 10 mins.',
              comorbidities: ['dm_insulin'], highRiskCriteria: ['macrosomia'], cmiScore: 1, addedAt: Date.now() - (260 * 60000) 
            },
            {
              id: 'w6', name: 'Priya Sharma', rn: 'RN-10024', location: 'Ward 4A',
              gravida: '4', para: '3', dilation: '5', antenatalTag: 'White', notes: 'Awaiting LR bed. Multipara, might progress fast.',
              comorbidities: [], highRiskCriteria: [], cmiScore: 0, addedAt: Date.now() - (80 * 60000)
            },
            {
              id: 'w7', name: 'Fatima Zahra', rn: 'RN-10025', location: 'Patient Assessment Centre (PAC)',
              gravida: '1', para: '0', dilation: '2', antenatalTag: 'Green', notes: 'Early labor. Keep in view for discharge if no progress.',
              comorbidities: [], highRiskCriteria: [], cmiScore: 0, addedAt: Date.now() - (310 * 60000) 
            },
            {
              id: 'w8', name: 'Grace Lee', rn: 'RN-10028', location: 'Ward 4B',
              gravida: '1', para: '0', dilation: '3', antenatalTag: 'White', notes: 'IOL day 1, mild cramps.',
              comorbidities: ['age_gt_44'], highRiskCriteria: [], cmiScore: 3, addedAt: Date.now() - (190 * 60000) 
            }
          ]);
          
          const [admitted, setAdmitted] = useState([
            {
              id: 'a1', name: 'Roshini Patel', rn: 'RN-10019', location: 'Patient Assessment Centre (PAC)',
              gravida: '2', para: '1', dilation: '10', antenatalTag: 'Green', notes: 'Active pushing.',
              comorbidities: [], highRiskCriteria: [], cmiScore: 0, addedAt: Date.now() - (400 * 60000), admittedAt: Date.now() - (120 * 60000), acceptedAt: Date.now() - (115 * 60000)
            },
            {
              id: 'a2', name: 'Nurul Huda', rn: 'RN-10020', location: 'Ward 4A',
              gravida: '3', para: '1', dilation: '8', antenatalTag: 'Red', notes: 'APH, stabilized.',
              comorbidities: ['placenta'], highRiskCriteria: ['prev_cs'], cmiScore: 4, addedAt: Date.now() - (200 * 60000), admittedAt: Date.now() - (45 * 60000), acceptedAt: null
            }
          ]);

          const [formData, setFormData] = useState({
            name: '', rn: '', location: 'Patient Assessment Centre (PAC)',
            gravida: '', para: '', dilation: '', antenatalTag: 'White',
            notes: '', comorbidities: [], highRiskCriteria: []
          });

          const availableBeds = MAX_BEDS - admitted.length;
          const overdueCount = waitlist.filter(p => (currentTime - p.addedAt) >= FOUR_HOURS_MS).length;

          const handleStartSession = () => {
            initAudio();
            setSessionStarted(true);
          };

          const addAlertMessage = (message, type = 'info') => {
            const id = crypto.randomUUID();
            setAlerts(prev => [...prev, { id, message, type }]);
            setTimeout(() => {
              setAlerts(prev => prev.filter(a => a.id !== id));
            }, 8000); 
          };

          // Timers and Alarms
          useEffect(() => {
            if (!sessionStarted) return;
            const timer = setInterval(() => {
              setCurrentTime(Date.now());
            }, 60000); 
            return () => clearInterval(timer);
          }, [sessionStarted]);

          useEffect(() => {
            if (!sessionStarted) return;
            let alarmTriggered = false;
            waitlist.forEach(p => {
              if (currentTime - p.addedAt >= FOUR_HOURS_MS && !notifiedOverdueRef.current.has(p.id)) {
                notifiedOverdueRef.current.add(p.id);
                alarmTriggered = true;
              }
            });
            if (alarmTriggered) {
              playAlarmSound();
              addAlertMessage("🚨 CRITICAL: Patient waiting > 4 Hours! Immediate action required.", "danger");
            }
          }, [currentTime, waitlist, sessionStarted]);

          useEffect(() => {
            if (!sessionStarted) return;
            if (availableBeds > 0 && waitlist.length > 0) {
              if (!lrCallNotified) {
                playSuccessSound();
                addAlertMessage("🛏️ LR Bed Available! You can transfer a patient from the waitlist.", "success");
                setLrCallNotified(true);
              }
            } else {
              setLrCallNotified(false);
            }
          }, [availableBeds, waitlist.length, lrCallNotified, sessionStarted]);

          useEffect(() => {
            if (!sessionStarted) return;
            let trigger = false;
            setEmptyBedTimers(prev => prev.map(bed => {
              if (currentTime - bed.emptySince >= ONE_HOUR_MS && !bed.notified) {
                trigger = true;
                return { ...bed, notified: true };
              }
              return bed;
            }));
            if (trigger) {
              playNoticeSound();
              addAlertMessage("⏳ Notice: A Labor Room bed has been empty for over 1 Hour.", "warning");
            }
          }, [currentTime, sessionStarted]);

          const sortedWaitlist = [...waitlist].sort((a, b) => {
            const priorityA = TAG_PRIORITY[a.antenatalTag || 'White'];
            const priorityB = TAG_PRIORITY[b.antenatalTag || 'White'];
            if (priorityA !== priorityB) return priorityA - priorityB;
            if ((b.cmiScore || 0) !== (a.cmiScore || 0)) return (b.cmiScore || 0) - (a.cmiScore || 0);
            return a.addedAt - b.addedAt;
          });

          const handleAddPatient = (e) => {
            e.preventDefault();
            let cmiScore = 0;
            formData.comorbidities.forEach(id => {
              const condition = COMORBIDITIES.find(c => c.id === id);
              if (condition) cmiScore += condition.points;
            });
            const newPatient = { id: crypto.randomUUID(), ...formData, cmiScore, addedAt: Date.now() };
            setWaitlist([...waitlist, newPatient]);
            setShowAddForm(false);
            setFormData({ name: '', rn: '', location: 'Patient Assessment Centre (PAC)', gravida: '', para: '', dilation: '', antenatalTag: 'White', notes: '', comorbidities: [], highRiskCriteria: [] });
          };

          const admitPatient = (patient) => {
            if (availableBeds <= 0) return;
            setWaitlist(waitlist.filter(p => p.id !== patient.id));
            setAdmitted([...admitted, { ...patient, admittedAt: Date.now(), acceptedAt: null }]);
            setEmptyBedTimers(prev => {
              const newArr = [...prev];
              if (newArr.length > 0) newArr.shift();
              return newArr;
            });
          };

          const acceptPatient = (patientId) => {
            setAdmitted(admitted.map(p => p.id === patientId ? { ...p, acceptedAt: Date.now() } : p));
          };

          const dischargePatient = (patientId) => {
            setAdmitted(admitted.filter(p => p.id !== patientId));
            setEmptyBedTimers(prev => [...prev, { id: crypto.randomUUID(), emptySince: Date.now(), notified: false }]);
          };

          const removePatient = (patientId) => {
            setWaitlist(waitlist.filter(p => p.id !== patientId));
          };

          const renderAlerts = () => (
            <div className="fixed top-20 right-4 z-50 flex flex-col gap-3 pointer-events-none">
              {alerts.map(a => (
                <div key={a.id} className={`w-80 p-4 rounded-xl shadow-2xl flex items-start gap-3 border-l-4 animate-in slide-in-from-right fade-in duration-300 ${a.type === 'danger' ? 'bg-red-50 border-red-600 text-red-800' : a.type === 'success' ? 'bg-emerald-50 border-emerald-500 text-emerald-800' : 'bg-amber-50 border-amber-500 text-amber-800'}`}>
                  <div className="flex-1 text-sm font-bold">{a.message}</div>
                </div>
              ))}
            </div>
          );

          const renderAddPatientForm = () => (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-xl shadow-2xl w-full max-w-2xl overflow-hidden flex flex-col max-h-[90vh]">
                <div className="bg-slate-800 text-white p-4 flex justify-between items-center shrink-0">
                  <h2 className="text-xl font-bold flex items-center gap-2"><i className="fa-solid fa-plus w-5"></i> Add Patient to Waitlist</h2>
                  <button onClick={() => setShowAddForm(false)} className="text-slate-300 hover:text-white"><i className="fa-solid fa-xmark text-2xl"></i></button>
                </div>
                <form onSubmit={handleAddPatient} className="p-4 overflow-y-auto flex-1">
                  <div className="grid md:grid-cols-2 gap-6">
                    <div className="space-y-4">
                      <h3 className="font-semibold text-lg border-b pb-2">Patient Details</h3>
                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">Patient Name</label>
                        <input required type="text" value={formData.name} onChange={e => setFormData(prev => ({...prev, name: e.target.value}))} className="w-full p-2 border rounded-lg focus:ring-2 focus:ring-purple-500" placeholder="e.g. Jane Doe" />
                      </div>
                      <div className="grid grid-cols-2 gap-4">
                        <div>
                          <label className="block text-sm font-medium text-gray-700 mb-1">Reg No (RN)</label>
                          <input required type="text" value={formData.rn} onChange={e => setFormData(prev => ({...prev, rn: e.target.value}))} className="w-full p-2 border rounded-lg" placeholder="RN-12345" />
                        </div>
                        <div>
                          <label className="block text-sm font-medium text-gray-700 mb-1">Current Location</label>
                          <select value={formData.location} onChange={e => setFormData(prev => ({...prev, location: e.target.value}))} className="w-full p-2 border rounded-lg bg-white">
                            {LOCATIONS.map(loc => <option key={loc} value={loc}>{loc}</option>)}
                          </select>
                        </div>
                      </div>
                      <div className="grid grid-cols-3 gap-4">
                        <div>
                          <label className="block text-sm font-medium text-gray-700 mb-1">Gravida</label>
                          <input required type="number" min="1" value={formData.gravida} onChange={e => setFormData(prev => ({...prev, gravida: e.target.value}))} className="w-full p-2 border rounded-lg" />
                        </div>
                        <div>
                          <label className="block text-sm font-medium text-gray-700 mb-1">Para</label>
                          <input required type="number" min="0" value={formData.para} onChange={e => setFormData(prev => ({...prev, para: e.target.value}))} className="w-full p-2 border rounded-lg" />
                        </div>
                        <div>
                          <label className="block text-sm font-medium text-gray-700 mb-1">OS (cm)</label>
                          <input required type="number" min="0" max="10" value={formData.dilation} onChange={e => setFormData(prev => ({...prev, dilation: e.target.value}))} className="w-full p-2 border rounded-lg" placeholder="0-10" />
                        </div>
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">MOH Antenatal Tagging (Buku Pink)</label>
                        <div className="grid grid-cols-2 gap-2">
                          {Object.entries(ANTENATAL_TAGS).map(([tag, styles]) => (
                            <label key={tag} className={`flex items-center p-2 border rounded-lg cursor-pointer transition-colors ${formData.antenatalTag === tag ? 'ring-2 ring-offset-1 ring-slate-400 bg-slate-50' : 'bg-gray-50 hover:bg-gray-100 border-gray-200'}`}>
                               <input type="radio" name="antenatalTag" value={tag} checked={formData.antenatalTag === tag} onChange={e => setFormData(prev => ({...prev, antenatalTag: e.target.value}))} className="hidden" />
                               <div className={`w-3 h-3 rounded-full mr-2 shadow-sm ${styles.badge}`}></div>
                               <span className="text-sm font-semibold text-gray-800">{tag} Tag</span>
                            </label>
                          ))}
                        </div>
                      </div>
                      <div>
                        <label className="block text-sm font-medium text-gray-700 mb-1">Clinical Notes</label>
                        <textarea value={formData.notes} onChange={e => setFormData(prev => ({...prev, notes: e.target.value}))} className="w-full p-2 border rounded-lg" rows="2" placeholder="Brief history or specific flags..."></textarea>
                      </div>
                    </div>
                    <div className="space-y-4">
                      <div className="bg-red-50 p-3 rounded-xl border border-red-200">
                        <div className="flex justify-between items-end border-b border-red-200 pb-2 mb-3">
                          <h3 className="font-semibold text-lg text-red-700 flex items-center gap-2"><i className="fa-solid fa-triangle-exclamation"></i> High Risk Flags</h3>
                        </div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                          {HIGH_RISK_CRITERIA.map((criteria) => (
                            <label key={criteria.id} className="flex items-start p-2 hover:bg-red-100/50 rounded-lg cursor-pointer transition-colors border border-transparent hover:border-red-200">
                              <input 
                                type="checkbox" 
                                className="mt-1 mr-2 rounded border-red-300 text-red-600 focus:ring-red-500"
                                checked={formData.highRiskCriteria.includes(criteria.id)}
                                onChange={() => {
                                  setFormData(prev => {
                                    const current = prev.highRiskCriteria;
                                    return { ...prev, highRiskCriteria: current.includes(criteria.id) ? current.filter(id => id !== criteria.id) : [...current, criteria.id] };
                                  });
                                }}
                              />
                              <span className="text-sm font-medium text-red-900">{criteria.label}</span>
                            </label>
                          ))}
                        </div>
                      </div>
                      <div className="flex justify-between items-end border-b pb-2 mt-4">
                        <h3 className="font-semibold text-lg">Maternal Comorbidities</h3>
                        <span className="text-xs font-medium text-slate-500 bg-slate-100 px-2 py-1 rounded">OB-CMI Index</span>
                      </div>
                      <div className="max-h-[400px] overflow-y-auto pr-2 space-y-1">
                        {COMORBIDITIES.map((comorbidity) => (
                          <label key={comorbidity.id} className="flex items-start p-2 hover:bg-slate-50 rounded cursor-pointer border border-transparent hover:border-slate-200 transition-all">
                            <input 
                              type="checkbox" 
                              className="mt-1 mr-3 rounded border-gray-300 text-purple-600 focus:ring-purple-500"
                              checked={formData.comorbidities.includes(comorbidity.id)}
                              onChange={() => {
                                 setFormData(prev => {
                                   const current = prev.comorbidities;
                                   return { ...prev, comorbidities: current.includes(comorbidity.id) ? current.filter(id => id !== comorbidity.id) : [...current, comorbidity.id] };
                                 });
                              }}
                            />
                            <div className="flex-1 flex justify-between items-start gap-2">
                              <span className="text-sm text-gray-700">{comorbidity.label}</span>
                              <span className="text-xs font-bold text-slate-400 shrink-0">+{comorbidity.points} pts</span>
                            </div>
                          </label>
                        ))}
                      </div>
                    </div>
                  </div>
                  <div className="mt-6 pt-4 border-t">
                    <button type="submit" className="w-full bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:from-violet-700 hover:to-fuchsia-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition-colors">
                      Add to Waitlist
                    </button>
                  </div>
                </form>
              </div>
            </div>
          );

          const renderPatientTable = (patients, isWaitlist) => {
            if (patients.length === 0) {
              return (
                <div className="text-center py-12 bg-white rounded-xl border border-dashed border-gray-300">
                  {isWaitlist ? <i className="fa-solid fa-user text-5xl text-gray-300 mb-3 block"></i> : <i className="fa-solid fa-bed text-5xl text-gray-300 mb-3 block"></i>}
                  <h3 className="text-lg font-semibold text-gray-700">{isWaitlist ? 'No patients waiting' : 'Labor Room is empty'}</h3>
                  <p className="text-gray-500 mt-1">{isWaitlist ? 'Add patients from PAC or Ward to track them here.' : `All ${MAX_BEDS} beds are currently available.`}</p>
                </div>
              );
            }
            return (
              <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div className="overflow-x-auto">
                  <table className="w-full text-left border-collapse min-w-[850px]">
                    <thead>
                      <tr className="bg-slate-800 text-white text-sm">
                        <th className="p-4 font-semibold w-1/4">Patient Details</th>
                        <th className="p-4 font-semibold w-1/5">Location & OS</th>
                        <th className="p-4 font-semibold w-1/4">Risk Profile</th>
                        <th className="p-4 font-semibold w-1/6">Duration</th>
                        <th className="p-4 font-semibold text-right w-32">Actions</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-200">
                      {patients.map(patient => {
                        const tagInfo = ANTENATAL_TAGS[patient.antenatalTag || 'White'];
                        const waitTimeMs = currentTime - patient.addedAt;
                        const isOverdue = waitTimeMs >= FOUR_HOURS_MS && isWaitlist;
                        const patientComorbidities = patient.comorbidities ? patient.comorbidities.map(id => COMORBIDITIES.find(c => c.id === id)).filter(Boolean) : [];
                        const patientHighRisk = patient.highRiskCriteria ? patient.highRiskCriteria.map(id => HIGH_RISK_CRITERIA.find(c => c.id === id)).filter(Boolean) : [];

                        return (
                          <tr key={patient.id} className={`${tagInfo.bg} hover:bg-slate-100 transition-colors border-l-[4px] ${isOverdue ? 'border-l-red-600' : 'border-l-transparent'}`}>
                            <td className="p-4 align-top">
                              <div className="font-bold text-gray-900 text-base">{patient.name}</div>
                              <div className="text-sm text-gray-600 mb-1">RN: {patient.rn}</div>
                              <div className="text-sm font-medium text-slate-700 mb-2">G{patient.gravida}P{patient.para}</div>
                              <span className={`inline-flex items-center px-2 py-0.5 rounded text-xs font-bold shadow-sm ${tagInfo.badge}`}>
                                {tagInfo.label.split(' ')[0]} Tag
                              </span>
                            </td>
                            <td className="p-4 align-top">
                              <div className="flex items-center gap-1.5 text-sm text-gray-700 mb-1"><i className="fa-solid fa-location-dot text-gray-400"></i> {patient.location}</div>
                              <div className="flex items-center gap-1.5 text-sm text-gray-700"><i className="fa-solid fa-wave-square text-gray-400"></i> OS: <span className="font-bold text-black">{patient.dilation} cm</span></div>
                            </td>
                            <td className="p-4 align-top">
                              {patientHighRisk.length > 0 && (
                                <div className="inline-flex items-center gap-1.5 text-sm font-extrabold px-3 py-1.5 rounded-lg bg-yellow-400 text-black mb-2 uppercase tracking-wide shadow-sm w-full animate-warning-blink">
                                   <i className="fa-solid fa-triangle-exclamation"></i> HIGH RISK ALERTS
                                </div>
                              )}
                              {patient.cmiScore > 0 && (
                                <div className="inline-flex items-center gap-1 text-xs font-bold text-red-700 bg-red-100 px-2 py-0.5 rounded border border-red-200 mb-2">
                                  <i className="fa-solid fa-heart-pulse"></i> OB-CMI: {patient.cmiScore}
                                </div>
                              )}
                              {patientHighRisk.length > 0 && (
                                <div className="flex flex-wrap gap-1 mb-2">
                                  {patientHighRisk.map(c => (
                                    <span key={c.id} className="inline-flex items-center text-[10px] font-bold px-1.5 py-0.5 rounded bg-red-100 text-red-800 border border-red-200 shadow-sm uppercase"><i className="fa-solid fa-triangle-exclamation mr-1"></i> {c.label}</span>
                                  ))}
                                </div>
                              )}
                              {patientComorbidities.length > 0 && (
                                <div className="flex flex-wrap gap-1 mb-2">
                                  {patientComorbidities.map(c => (
                                    <span key={c.id} className="inline-flex items-center text-[10px] font-medium px-1.5 py-0.5 rounded bg-slate-200 text-slate-700 border border-slate-300">{c.label}</span>
                                  ))}
                                </div>
                              )}
                              {patient.notes && (<div className="text-xs text-gray-600 italic mt-1 bg-white/60 p-1.5 rounded border border-gray-200">"{patient.notes}"</div>)}
                            </td>
                            <td className="p-4 align-top">
                               {isWaitlist ? (
                                 <>
                                   {isOverdue && (
                                     <div className="inline-flex items-center justify-center gap-1.5 text-base font-black px-3 py-2 rounded-lg border-2 mb-2 animate-urgent-blink uppercase tracking-widest shadow-lg w-full text-center">
                                       <i className="fa-solid fa-triangle-exclamation"></i> OVERDUE
                                     </div>
                                   )}
                                   <div className={`flex items-center gap-1.5 font-bold ${isOverdue ? 'animate-urgent-blink text-lg px-2 py-1 rounded shadow' : 'text-slate-700 text-sm'}`}>
                                     <i className="fa-solid fa-clock"></i> {formatWaitTime(patient.addedAt, currentTime)}
                                   </div>
                                   <div className="text-xs text-slate-500 mt-1 font-medium">Total Wait Time</div>
                                 </>
                               ) : (
                                 patient.acceptedAt ? (
                                   <>
                                     <div className="flex items-center gap-1.5 font-bold text-slate-700 text-sm">
                                       <i className="fa-solid fa-clock"></i> {formatWaitTime(patient.acceptedAt, currentTime)}
                                     </div>
                                     <div className="text-xs text-slate-500 mt-1 font-medium">Time in LR</div>
                                   </>
                                 ) : (
                                   <>
                                     <div className="flex items-center gap-1.5 font-bold text-amber-600 text-sm animate-pulse">
                                       <i className="fa-solid fa-clock"></i> Pending
                                     </div>
                                     <div className="text-xs text-amber-600/80 mt-1 font-medium">Awaiting Acceptance</div>
                                   </>
                                 )
                               )}
                            </td>
                            <td className="p-4 align-top text-right">
                              <div className="flex flex-col items-end gap-2">
                                {isWaitlist ? (
                                  <>
                                    <button onClick={() => admitPatient(patient)} disabled={availableBeds <= 0} className={`w-full flex items-center justify-center gap-1 px-3 py-2 rounded-lg font-bold text-sm shadow-sm transition-all ${availableBeds > 0 ? 'bg-purple-600 text-white hover:bg-purple-700 hover:shadow-purple-500/30' : 'bg-gray-200 text-gray-400 cursor-not-allowed'}`}>
                                      SEND TO LR <i className="fa-solid fa-arrow-right text-xs"></i>
                                    </button>
                                    <button onClick={() => removePatient(patient.id)} className="w-full px-3 py-1.5 text-xs font-semibold text-red-600 hover:bg-red-50 border border-transparent hover:border-red-200 rounded-lg transition-colors">Remove</button>
                                  </>
                                ) : (
                                  !patient.acceptedAt ? (
                                    <button onClick={() => acceptPatient(patient.id)} className="w-full flex items-center justify-center gap-1 px-3 py-2 bg-blue-600 text-white hover:bg-blue-700 rounded-lg font-bold text-sm shadow-sm transition-colors border border-blue-700">
                                      <i className="fa-solid fa-circle-check"></i> ACCEPT
                                    </button>
                                  ) : (
                                    <button onClick={() => dischargePatient(patient.id)} className="w-full flex items-center justify-center gap-1 px-3 py-2 bg-green-100 text-green-700 hover:bg-green-200 rounded-lg font-bold text-sm shadow-sm transition-colors border border-green-300">
                                      <i className="fa-solid fa-circle-check"></i> Discharge
                                    </button>
                                  )
                                )}
                              </div>
                            </td>
                          </tr>
                        );
                      })}
                    </tbody>
                  </table>
                </div>
              </div>
            );
          };

          if (!sessionStarted) {
            return (
              <div className="min-h-screen flex items-center justify-center p-4">
                 <div className="bg-white max-w-md w-full rounded-2xl shadow-2xl p-8 text-center border">
                    <i className="fa-solid fa-bell text-5xl text-fuchsia-600 mb-6 block animate-bounce"></i>
                    <h1 className="text-2xl font-extrabold text-slate-900 mb-2">ActiveTOFully OBGYN HSIJB</h1>
                    <p className="text-slate-600 mb-8">Click below to initialize the dashboard and enable audio system alarms for overdue patients and bed availability.</p>
                    <button onClick={handleStartSession} className="w-full bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:from-violet-700 hover:to-fuchsia-700 text-white font-bold py-4 px-6 rounded-xl shadow-lg transition-transform hover:scale-105 active:scale-95 text-lg">
                      Start Shift & Enable Alarms
                    </button>
                 </div>
              </div>
            );
          }

          return (
            <div className="pb-20 md:pb-0">
              {renderAlerts()}
              
              <header className="bg-gradient-to-r from-violet-700 via-fuchsia-600 to-rose-500 text-white sticky top-0 z-40 shadow-lg">
                <div className="max-w-6xl mx-auto px-4 py-4 sm:px-6 lg:px-8">
                  <div className="flex justify-between items-center">
                    <div>
                      <h1 className="text-xl md:text-2xl font-extrabold tracking-tight drop-shadow-sm">ActiveTOFully OBGYN HSIJB</h1>
                      <p className="text-pink-100 text-sm font-medium opacity-90">Active Phase Management Dashboard</p>
                    </div>
                  </div>
                </div>
              </header>

              <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 mt-4">
                <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
                  <div className="col-span-2 md:col-span-5 flex justify-between items-center bg-white rounded-xl shadow-sm border border-slate-200 p-3">
                     <div className="flex items-center gap-2 text-slate-600">
                       <i className="fa-solid fa-calendar-days"></i>
                       <span className="font-medium text-sm md:text-base">{new Date(currentTime).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}</span>
                     </div>
                     <div className="flex items-center gap-2 text-slate-900">
                       <i className="fa-solid fa-clock text-purple-600"></i>
                       <span className="font-bold text-lg">{new Date(currentTime).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })}</span>
                     </div>
                  </div>
                  <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-3 flex flex-col justify-center border-l-[4px] border-l-yellow-400">
                    <span className="text-xs text-slate-500 font-semibold uppercase tracking-wider mb-1">Waiting List</span>
                    <span className="text-2xl font-bold text-slate-800">{waitlist.length} <span className="text-sm font-normal text-slate-400">active</span></span>
                  </div>
                  <div className={`rounded-xl shadow-sm border p-3 flex flex-col justify-center transition-all duration-300 ${overdueCount > 0 ? 'animate-urgent-blink border-red-600' : 'bg-white border-slate-200 border-l-[4px] border-l-red-100'}`}>
                     <div className="flex justify-between items-center mb-1">
                        <span className={`text-xs font-semibold uppercase tracking-wider ${overdueCount > 0 ? 'text-white' : 'text-slate-500'}`}>Overdue &gt; 4 Hrs</span>
                        <i className={`fa-solid fa-triangle-exclamation ${overdueCount > 0 ? 'text-white' : 'text-red-500'}`}></i>
                     </div>
                     <span className={`text-2xl font-bold ${overdueCount > 0 ? 'text-white' : 'text-slate-800'}`}>{overdueCount}</span>
                  </div>
                  <div className={`bg-white rounded-xl shadow-sm border border-slate-200 p-3 flex flex-col justify-center border-l-[4px] ${availableBeds > 0 ? 'border-l-green-400' : 'border-l-red-500'}`}>
                    <span className="text-xs text-slate-500 font-semibold uppercase tracking-wider mb-1">Free LR Beds</span>
                    <span className="text-2xl font-bold text-slate-800">{availableBeds} <span className="text-sm font-normal text-slate-400">/ {MAX_BEDS}</span></span>
                  </div>
                  <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-3 flex flex-col justify-center">
                    <div className="flex justify-between items-center mb-1">
                      <span className="text-xs text-slate-500 font-semibold uppercase tracking-wider">Doctors On Duty</span>
                      <i className="fa-solid fa-stethoscope text-violet-500"></i>
                    </div>
                    <div className="flex justify-between items-center mt-1">
                      <span className="text-2xl font-bold text-slate-800">{doctorsCount}</span>
                      <div className="flex bg-slate-100 rounded-lg overflow-hidden border border-slate-200">
                         <button onClick={() => setDoctorsCount(Math.max(0, doctorsCount - 1))} className="px-2.5 py-1 hover:bg-slate-200 text-slate-600 font-bold active:bg-slate-300">-</button>
                         <button onClick={() => setDoctorsCount(doctorsCount + 1)} className="px-2.5 py-1 hover:bg-slate-200 text-slate-600 font-bold border-l border-slate-200 active:bg-slate-300">+</button>
                      </div>
                    </div>
                  </div>
                  <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-3 flex flex-col justify-center">
                    <div className="flex justify-between items-center mb-1">
                      <span className="text-xs text-slate-500 font-semibold uppercase tracking-wider">Nurses On Duty</span>
                      <i className="fa-solid fa-users text-rose-500"></i>
                    </div>
                    <div className="flex justify-between items-center mt-1">
                      <span className="text-2xl font-bold text-slate-800">{nursesCount}</span>
                      <div className="flex bg-slate-100 rounded-lg overflow-hidden border border-slate-200">
                         <button onClick={() => setNursesCount(Math.max(0, nursesCount - 1))} className="px-2.5 py-1 hover:bg-slate-200 text-slate-600 font-bold active:bg-slate-300">-</button>
                         <button onClick={() => setNursesCount(nursesCount + 1)} className="px-2.5 py-1 hover:bg-slate-200 text-slate-600 font-bold border-l border-slate-200 active:bg-slate-300">+</button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 my-4">
                <div className="flex bg-gray-200 p-1 rounded-xl">
                  <button 
                    onClick={() => setActiveTab('waitlist')}
                    className={`flex-1 flex items-center justify-center gap-2 py-2.5 rounded-lg font-semibold text-sm transition-all ${activeTab === 'waitlist' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                  >
                    <i className="fa-solid fa-clipboard-list"></i> Waitlist 
                    {waitlist.length > 0 && <span className="bg-purple-600 text-white text-xs px-2 py-0.5 rounded-full ml-1 shadow-sm">{waitlist.length}</span>}
                  </button>
                  <button 
                    onClick={() => setActiveTab('laborRoom')}
                    className={`flex-1 flex items-center justify-center gap-2 py-2.5 rounded-lg font-semibold text-sm transition-all ${activeTab === 'laborRoom' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
                  >
                    <i className="fa-solid fa-bed"></i> Labor Room
                    <span className={`text-xs px-2 py-0.5 rounded-full ml-1 ${admitted.length === MAX_BEDS ? 'bg-red-100 text-red-700' : 'bg-green-100 text-green-700'}`}>
                      {admitted.length}/{MAX_BEDS}
                    </span>
                  </button>
                </div>
              </div>

              <main className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
                {activeTab === 'waitlist' && (<div className="animate-in fade-in duration-300">{renderPatientTable(sortedWaitlist, true)}</div>)}
                {activeTab === 'laborRoom' && (<div className="animate-in fade-in duration-300">{renderPatientTable(admitted, false)}</div>)}
              </main>

              <div className="fixed bottom-6 right-6 z-40 md:static md:mt-8 md:max-w-6xl md:mx-auto md:px-8">
                <button 
                  onClick={() => setShowAddForm(true)}
                  className="bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:from-violet-700 hover:to-fuchsia-700 text-white rounded-full md:rounded-xl p-4 md:py-3 md:px-6 shadow-lg shadow-fuchsia-500/40 flex items-center justify-center gap-2 transition-all hover:scale-105 active:scale-95 w-14 h-14 md:w-full md:h-auto border border-white/20"
                >
                  <i className="fa-solid fa-plus text-xl md:hidden"></i>
                  <span className="hidden md:flex font-bold items-center gap-2"><i className="fa-solid fa-plus"></i> Add New Patient to Waitlist</span>
                </button>
              </div>

              {showAddForm && renderAddPatientForm()}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
